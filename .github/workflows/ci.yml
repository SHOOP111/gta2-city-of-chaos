name: Windows Build and Test CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test-windows:
    name: Windows MSVC (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTS=ON

      - name: Build All Targets
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run Test Suite (Autonomous Headless Simulation)
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Upload Windows Game Executable (Release Only)
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: gta2-city-of-chaos-windows-x64
          path: |
            build/Release/gta2_game.exe
            build/gta2_game.exe
            build/Release/gta2_tests.exe
            build/gta2_tests.exe
          if-no-files-found: warn
